<!-- Theme Toggle Button -->
<button
  type="button"
  @click.prevent="darkMode = !darkMode; document.documentElement.classList.toggle('dark', darkMode); localStorage.setItem('darkMode', JSON.stringify(darkMode))"
  class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-md border border-[#E2DDD3] bg-[#FBF9F5] text-[#6E6A61] transition-colors select-none hover:border-[#1C1B18] hover:text-[#1C1B18] focus-visible:outline-none dark:border-[#2C2B27] dark:bg-[#1B1B19] dark:text-[#9B968B] dark:hover:border-[#EAE6DD] dark:hover:text-[#EAE6DD]"
  aria-label="Toggle color theme"
  title="Toggle light / dark theme"
>
  <!-- Sun Icon (Dark Mode) -->
  <svg
    x-cloak
    x-show="darkMode"
    class="h-4 w-4"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <circle cx="12" cy="12" r="4" />
    <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41" />
  </svg>

  <!-- Moon Icon (Light Mode) -->
  <svg
    x-cloak
    x-show="!darkMode"
    class="h-4 w-4"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
  </svg>
</button>

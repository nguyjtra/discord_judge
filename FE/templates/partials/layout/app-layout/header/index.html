<!-- App Header -->
<header
  @keydown.window="(e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $refs.searchInput?.focus(); } }"
  class="sticky top-0 z-50 flex w-full shrink-0 border-b border-[#E2DDD3] bg-[#F6F4EF]/85 backdrop-blur-md dark:border-[#2C2B27] dark:bg-[#141413]/85"
>
  <div class="flex w-full items-center justify-between gap-4 px-4 py-3.5 md:px-8">
    <!-- Left controls: sidebar toggle + mobile brand + live search -->
    <div class="flex flex-1 items-center gap-4">
      <button
        type="button"
        @click.stop="sidebarToggle = !sidebarToggle"
        aria-label="Toggle Sidebar"
        class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-md border border-[#E2DDD3] bg-[#FBF9F5] text-[#6E6A61] transition-colors hover:border-[#1C1B18] hover:text-[#1C1B18] focus-visible:outline-none dark:border-[#2C2B27] dark:bg-[#1B1B19] dark:text-[#9B968B] dark:hover:border-[#EAE6DD] dark:hover:text-[#EAE6DD]"
      >
        <svg
          x-show="sidebarToggle && window.innerWidth < 1280"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.6"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
        <svg
          x-show="!sidebarToggle || window.innerWidth >= 1280"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.6"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h12M4 17h16" />
        </svg>
      </button>

      <!-- Mobile Brand -->
      <a href="/admin" class="flex items-center gap-2.5 xl:hidden">
        <span class="flex h-7 w-7 items-center justify-center bg-[#1C1B18] font-serif text-xs italic text-[#F6F4EF] dark:bg-[#EAE6DD] dark:text-[#141413]">
          D
        </span>
        <span class="font-serif text-base font-medium text-[#1C1B18] dark:text-[#EAE6DD]">
          Discord Judge
        </span>
      </a>

      <!-- Minimalist Inline Search -->
      <form @submit.prevent class="hidden max-w-md flex-1 md:block">
        <div class="group relative flex items-center border-b border-[#E2DDD3] transition-colors focus-within:border-[#1C1B18] dark:border-[#2C2B27] dark:focus-within:border-[#EAE6DD]">
          <svg
            class="h-3.5 w-3.5 shrink-0 text-[#9A9488] transition-colors group-focus-within:text-[#1C1B18] dark:text-[#6E6A61] dark:group-focus-within:text-[#EAE6DD]"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="1.6"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input
            x-ref="searchInput"
            type="text"
            x-model="searchQuery"
            placeholder="Filter problems, tickets, or Discord ID..."
            class="w-full bg-transparent px-2.5 py-2 text-xs text-[#1C1B18] placeholder:text-[#9A9488] focus:outline-none dark:text-[#EAE6DD] dark:placeholder:text-[#6E6A61]"
          />
          <button
            type="button"
            x-cloak
            x-show="searchQuery"
            @click="searchQuery = ''"
            class="mr-2 font-mono text-[10px] text-[#9A9488] hover:text-[#1C1B18] dark:hover:text-[#EAE6DD]"
          >
            Clear
          </button>
          <kbd
            @click="$refs.searchInput.focus()"
            class="cursor-pointer font-mono text-[10px] tracking-wider text-[#9A9488] select-none dark:text-[#6E6A61]"
          >
            ⌘K
          </kbd>
        </div>
      </form>
    </div>

    <!-- Right controls -->
    <div class="flex items-center gap-3">
      <span class="hidden items-center gap-2 font-mono text-[11px] text-[#6E6A61] sm:inline-flex dark:text-[#9B968B]">
        <span class="status-dot-pulse h-1.5 w-1.5 rounded-full bg-[#2E6F50] dark:bg-[#6EB38E]" style="--dot-glow: rgba(46, 111, 80, 0.45);"></span>
        Sandbox Live
      </span>
      <include src="./theme-toggler.html" />
    </div>
  </div>
</header>

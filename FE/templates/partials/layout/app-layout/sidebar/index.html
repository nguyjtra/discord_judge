<!-- Skip to main content -->
<a class="sr-only" href="#main-content">skip to the main content</a>

<!-- Sidebar Backdrop (Mobile) -->
<div
  x-cloak
  x-show="sidebarToggle"
  class="fixed inset-0 z-99 bg-[#1C1B18]/40 backdrop-blur-xs xl:hidden"
  aria-hidden="true"
  @click="sidebarToggle = false"
  x-transition.opacity
></div>

<aside
  x-cloak
  :class="sidebarToggle ? 'translate-x-0 xl:w-20' : '-translate-x-full'"
  class="sidebar fixed top-0 left-0 z-9999 flex h-screen w-68 flex-col border-r border-[#E2DDD3] bg-[#F1EEE7] px-5 transition-all duration-300 xl:static xl:translate-x-0 dark:border-[#2C2B27] dark:bg-[#181816]"
  @click.outside="if (window.innerWidth < 1280) sidebarToggle = false"
  aria-label="sidebar navigation"
>
  <!-- Editorial Masthead Brand -->
  <div
    :class="sidebarToggle ? 'xl:justify-center' : 'justify-between'"
    class="flex items-center gap-3 border-b border-[#E2DDD3] py-7 dark:border-[#2C2B27]"
  >
    <a href="/admin" class="flex items-center gap-3.5">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center border border-[#1C1B18] bg-[#1C1B18] font-serif text-base italic text-[#F6F4EF] dark:border-[#EAE6DD] dark:bg-[#EAE6DD] dark:text-[#141413]">
        D
      </div>
      <div :class="sidebarToggle ? 'xl:hidden' : ''">
        <span class="block font-serif text-lg leading-tight font-medium tracking-tight text-[#1C1B18] dark:text-[#EAE6DD]">
          Discord Judge
        </span>
        <span class="mt-0.5 block font-mono text-[10px] tracking-[0.16em] text-[#6E6A61] uppercase dark:text-[#9B968B]">
          Console · Admin
        </span>
      </div>
    </a>
  </div>

  <!-- Navigation -->
  <div class="no-scrollbar flex flex-1 flex-col justify-between overflow-y-auto py-7">
    <nav aria-label="sidebar navigation" class="space-y-8">
      <div>
        <h3
          class="mb-3 px-2 font-mono text-[10px] font-medium tracking-[0.18em] text-[#9A9488] uppercase dark:text-[#6E6A61]"
          :class="sidebarToggle ? 'xl:hidden' : ''"
        >
          Index
        </h3>
        <ul class="flex flex-col gap-1">
          <li>
            <button
              type="button"
              @click="activeTab = 'all'; if (window.innerWidth < 1280) sidebarToggle = false"
              class="menu-item w-full text-left"
              :class="activeTab === 'all' ? 'menu-item-active' : 'menu-item-inactive'"
            >
              <span class="font-mono text-[11px] opacity-60 shrink-0">00</span>
              <span class="flex-1 truncate" :class="sidebarToggle ? 'xl:hidden' : ''">Overview</span>
            </button>
          </li>

          <li>
            <button
              type="button"
              @click="activeTab = 'problems'; if (window.innerWidth < 1280) sidebarToggle = false"
              class="menu-item w-full text-left"
              :class="activeTab === 'problems' ? 'menu-item-active' : 'menu-item-inactive'"
            >
              <span class="font-mono text-[11px] opacity-60 shrink-0">01</span>
              <span class="flex-1 truncate" :class="sidebarToggle ? 'xl:hidden' : ''">Problems</span>
              <span
                :class="sidebarToggle ? 'xl:hidden' : ''"
                class="font-mono text-xs tabular-nums text-[#6E6A61] dark:text-[#9B968B]"
                x-text="problems.length"
              >0</span>
            </button>
          </li>

          <li>
            <button
              type="button"
              @click="activeTab = 'tickets'; if (window.innerWidth < 1280) sidebarToggle = false"
              class="menu-item w-full text-left"
              :class="activeTab === 'tickets' ? 'menu-item-active' : 'menu-item-inactive'"
            >
              <span class="font-mono text-[11px] opacity-60 shrink-0">02</span>
              <span class="flex-1 truncate" :class="sidebarToggle ? 'xl:hidden' : ''">IT Tickets</span>
              <span
                :class="sidebarToggle ? 'xl:hidden' : ''"
                class="inline-flex items-center gap-1.5 font-mono text-xs tabular-nums text-[#6E6A61] dark:text-[#9B968B]"
              >
                <span x-show="openTicketsCount > 0" class="h-1.5 w-1.5 rounded-full bg-[#9A6B2F] dark:bg-[#D4A362]"></span>
                <span x-text="openTicketsCount">0</span>
              </span>
            </button>
          </li>

          <li>
            <button
              type="button"
              @click="activeTab = 'submissions'; if (window.innerWidth < 1280) sidebarToggle = false"
              class="menu-item w-full text-left"
              :class="activeTab === 'submissions' ? 'menu-item-active' : 'menu-item-inactive'"
            >
              <span class="font-mono text-[11px] opacity-60 shrink-0">03</span>
              <span class="flex-1 truncate" :class="sidebarToggle ? 'xl:hidden' : ''">Submissions</span>
              <span
                :class="sidebarToggle ? 'xl:hidden' : ''"
                class="font-mono text-xs tabular-nums text-[#6E6A61] dark:text-[#9B968B]"
                x-text="submissions.length"
              >0</span>
            </button>
          </li>
        </ul>
      </div>

      <div class="border-t border-[#E2DDD3] pt-6 dark:border-[#2C2B27]">
        <h3
          class="mb-3 px-2 font-mono text-[10px] font-medium tracking-[0.18em] text-[#9A9488] uppercase dark:text-[#6E6A61]"
          :class="sidebarToggle ? 'xl:hidden' : ''"
        >
          Actions
        </h3>
        <ul class="flex flex-col gap-1">
          <li>
            <button
              type="button"
              @click="openCreateProblem()"
              class="menu-item menu-item-inactive w-full text-left"
            >
              <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
              <span :class="sidebarToggle ? 'xl:hidden' : ''">New Problem</span>
            </button>
          </li>
          <li>
            <a
              href="/docs"
              target="_blank"
              class="menu-item menu-item-inactive"
            >
              <svg class="h-3.5 w-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7 17L17 7M17 7H8M17 7v9" />
              </svg>
              <span :class="sidebarToggle ? 'xl:hidden' : ''">API Docs</span>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <div
      :class="sidebarToggle ? 'xl:hidden' : ''"
      class="border-t border-[#E2DDD3] pt-5 dark:border-[#2C2B27]"
    >
      <p class="font-mono text-[10px] tracking-[0.12em] text-[#9A9488] uppercase dark:text-[#6E6A61]">
        Single-Admin Workspace
      </p>
      <p class="mt-1 text-xs text-[#6E6A61] dark:text-[#9B968B]">
        Docker Sandbox &amp; Discord Bot
      </p>
    </div>
  </div>
</aside>
